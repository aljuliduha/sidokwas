<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIDOKWAS NISEL</title>
<meta name="description" content="Sistem Informasi Dokumen Pengawasan, Penanganan Pelanggaran dan Sengketa - Bawaslu Kabupaten Nias Selatan">
<meta name="theme-color" content="#1D5C57">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIDOKWAS NISEL">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="ikon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="ikon-512.png">
<link rel="apple-touch-icon" sizes="192x192" href="ikon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="ikon-512.png">
<link rel="apple-touch-icon-precomposed" sizes="192x192" href="ikon-192.png">
<style>
  :root{ --teal:#1D5C57; --teal-d:#0E2E2B; --ink:#15212A; --muted:#566770; --paper:#F8F9F7; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px; padding-bottom:calc(24px + env(safe-area-inset-bottom));
    text-align:center;
  }
  .kotak{max-width:380px;width:100%}
  img.logo{width:168px;height:168px;display:block;margin:0 auto 22px}
  h1{font-size:26px;letter-spacing:.06em;margin:0 0 4px;color:var(--teal-d)}
  p.sub{margin:0 0 28px;color:var(--muted);font-size:14px}
  .tombol{
    display:inline-block;width:100%;padding:16px 20px;border-radius:14px;
    background:var(--teal);color:#fff;text-decoration:none;font-weight:600;font-size:17px;
    box-shadow:0 2px 6px rgba(21,33,42,.12);
  }
  .tombol:active{background:var(--teal-d)}
  .status{margin-top:18px;font-size:13px;color:var(--muted);min-height:20px}
  footer{margin-top:34px;font-size:12px;color:#8A969C;line-height:1.5}
  @media (prefers-color-scheme: dark){
    :root{ --paper:#10201E; --ink:#E8ECE9; --muted:#9BB0AC; }
    h1{color:#EAF2F0}
  }
</style>
</head>
<body>
<div class="kotak">
  <img class="logo" src="ikon-512.png" alt="Logo SIDOKWAS NISEL">
  <h1>SIDOKWAS NISEL</h1>
  <p class="sub">Sistem Informasi Dokumen Pengawasan, Penanganan Pelanggaran dan Sengketa<br>Bawaslu Kabupaten Nias Selatan</p>
  <a class="tombol" id="buka" href="#">Buka Aplikasi</a>
  <div class="status" id="status">Mengalihkan ke aplikasi&hellip;</div>
  <footer>Gunakan Akun Google yang telah didaftarkan Sekretariat.</footer>
</div>
<script>
var S = String.fromCharCode(47);
var ALAMAT = "https:" + S + S + "script.google.com" + S + "macros" + S + "s" + S
  + "AKfycbymwQqOmIf8w1ZcXLGzB2vRqYTdzrqocO_6pgfH4KCkvtDK5yiOhxgcsKYOidmKHzX9GQ" + S + "exec";

document.getElementById("buka").href = ALAMAT;

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}

var langsung = true;
try { langsung = new URL(location.href).searchParams.get("tunggu") !== "1"; } catch (e) {}

if (langsung) {
  setTimeout(function () { location.href = ALAMAT; }, 900);
} else {
  document.getElementById("status").textContent = "Ketuk tombol di atas untuk membuka aplikasi.";
}
</script>
</body>
</html>
